<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grammar Quest</title>
<meta name="theme-color" content="#F3F5FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12152A" media="(prefers-color-scheme: dark)">
<meta name="description" content="Grammar and vocabulary practice, one lesson a day">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
.backup{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.backup p{margin:0;flex:1 1 260px;color:var(--muted);font-size:16px}
.install{display:grid;gap:8px;background:var(--accent-soft);border-radius:18px;padding:16px 18px;font-size:18px}
.install p{margin:0;color:var(--ink);font-size:17px}
.install .btn{justify-self:start}
</style>
<style>
/* Layout: sticky stats header, one centered play column (max 760px); item cards are the only framed objects. */
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --sunk:#E8ECF6; --line:#D8DEEC;
  --ink:#1B2140; --muted:#5E6688;
  --accent:#4B4FD8; --accent-ink:#FFFFFF; --accent-soft:#E4E5FB; --accent-deep:#33369E;
  --ok:#17935B; --ok-soft:#DDF3E8; --bad:#D2453F; --bad-soft:#FBE3E1;
  --gold:#E9A82A; --gold-soft:#FCEFD2; --silver:#9AA3B8; --bronze:#C27B45;
  --shadow:0 2px 0 rgba(27,33,64,.08), 0 8px 24px rgba(27,33,64,.06);
  --f-display:"Fredoka","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12152A; --surface:#1B1F3A; --sunk:#242949; --line:#323862;
  --ink:#ECEEFB; --muted:#A5ABCD;
  --accent:#8D90FF; --accent-ink:#12152A; --accent-soft:#2A2E5E; --accent-deep:#5B5FD0;
  --ok:#3FCB8A; --ok-soft:#173A2E; --bad:#FF7A72; --bad-soft:#40222A;
  --gold:#F4BE4F; --gold-soft:#3D3320; --silver:#B9C0D4; --bronze:#DB9763;
  --shadow:0 2px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12152A; --surface:#1B1F3A; --sunk:#242949; --line:#323862;
  --ink:#ECEEFB; --muted:#A5ABCD;
  --accent:#8D90FF; --accent-ink:#12152A; --accent-soft:#2A2E5E; --accent-deep:#5B5FD0;
  --ok:#3FCB8A; --ok-soft:#173A2E; --bad:#FF7A72; --bad-soft:#40222A;
  --gold:#F4BE4F; --gold-soft:#3D3320; --silver:#B9C0D4; --bronze:#DB9763;
  --shadow:0 2px 0 rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.top-in{max-width:960px;margin:0 auto;display:grid;gap:10px}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:17px;transform:rotate(-6deg)}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:999px;padding:4px 12px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.combo{background:var(--gold-soft);color:var(--ink)}
.chip.combo.pop{animation:pop .45s}
.icon-btn{background:var(--sunk);border:0;border-radius:999px;width:36px;height:36px;display:grid;place-items:center;font-size:17px}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.meter{min-width:0}
.meter-lbl{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.meter-lbl b{color:var(--ink)}
.meter-lbl > span{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1000px){.lng{display:none}}
.bar{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar .fill{background:var(--accent)}
.bar .fill.unit{background:var(--gold)}
.bar.split i{border-radius:0}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}
@media (max-width:640px){.meters{grid-template-columns:1fr 1fr}.meters .meter:last-child{grid-column:1/-1}.brand span.t{display:none}}

/* main */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 80px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:22px}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:800;font-size:18px;background:var(--sunk);box-shadow:0 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.good{background:var(--ok);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--accent);font-weight:800;padding:4px 0;text-decoration:underline;text-underline-offset:3px}

/* home */
.hero{background:var(--surface);border-radius:24px;padding:26px;box-shadow:var(--shadow);display:grid;gap:14px;position:relative;overflow:hidden}
.hero .eyebrow{font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:34px}
.hero p{margin:0;color:var(--muted)}
.hero .deco{position:absolute;right:-20px;top:-20px;font-family:var(--f-display);font-weight:700;font-size:180px;line-height:1;color:var(--accent-soft);pointer-events:none;user-select:none}
.hero > *:not(.deco){position:relative}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ucard{background:var(--surface);border:2px solid transparent;border-radius:18px;padding:16px;text-align:left;display:grid;gap:8px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.ucard:hover{transform:translateY(-2px);border-color:var(--accent-soft)}
.ucard.today{border-color:var(--accent)}
.ucard .n{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.ucard h3{font-size:20px}
.ucard .tag{font-size:16px;color:var(--muted);font-weight:700}
.stars{display:flex;gap:4px;font-size:16px;letter-spacing:1px}
.stars .ex{display:inline-flex;gap:1px;padding:2px 6px;border-radius:8px;background:var(--sunk);font-size:13px;font-weight:800;align-items:center}
.medal-sm{width:28px;height:28px}
.note{font-size:16px;color:var(--muted);margin:0}

/* play */
.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:700;color:var(--muted);font-size:16px}
.ex-head{display:grid;gap:10px}
.ex-num{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;border-radius:10px;padding:2px 10px;font-size:18px}
.mech{background:var(--gold-soft);border-radius:999px;padding:3px 12px;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.ex-head h2{font-size:28px}
.task{margin:0;color:var(--muted);font-size:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.bank button{border:2px dashed var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;font-weight:800;font-size:17px}
.bank button.used{text-decoration:line-through;opacity:.45;border-style:solid}
.story{background:var(--surface);border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start;box-shadow:var(--shadow)}
.story .face{font-size:44px;line-height:1}
.story p{margin:0;font-size:18px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sunk);display:block;transition:background .3s,transform .3s}
.dots i.cur{background:var(--accent);transform:scale(1.25)}
.dots i.ok{background:var(--ok)} .dots i.miss{background:var(--bad)}

.card{background:var(--surface);border-radius:22px;padding:24px;box-shadow:var(--shadow);display:grid;gap:18px;position:relative}
.card.shake{animation:shake .4s}
.card.win{animation:glow .6s}
.pic{font-size:64px;line-height:1;width:104px;height:104px;border-radius:22px;background:var(--sunk);display:grid;place-items:center;margin:0 auto}
.ctx{color:var(--muted);font-size:18px;margin:0}
.sent{font-size:24px;line-height:1.9;margin:0;font-weight:600}
.sent input{font:inherit;font-weight:800;color:var(--accent);background:var(--accent-soft);border:0;border-bottom:3px solid var(--accent);border-radius:8px 8px 2px 2px;padding:0 10px;min-width:150px;max-width:100%;width:10ch}
.sent input.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok)}
.sent input.bad{color:var(--bad);background:var(--bad-soft);border-color:var(--bad)}
.sent .hint{color:var(--muted);font-weight:600;font-size:20px}
.u{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-color:var(--gold)}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fb{min-height:28px;font-weight:800;font-size:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb .ans{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:2px 10px}
.say{background:var(--sunk);border:0;border-radius:999px;padding:4px 12px;font-weight:800;font-size:15px}

/* chat */
.chat{display:grid;gap:10px}
.bub{max-width:88%;padding:12px 16px;border-radius:18px;font-size:21px;font-weight:600;line-height:1.8}
.bub small{display:block;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.bub.them{background:var(--sunk);justify-self:start;border-bottom-left-radius:4px}
.bub.me{background:var(--accent-soft);justify-self:end;border-bottom-right-radius:4px}
.bub.me input{font:inherit;font-weight:800;color:var(--accent);background:var(--surface);border:0;border-bottom:3px solid var(--accent);border-radius:8px 8px 2px 2px;padding:0 8px;min-width:120px;max-width:100%;width:10ch}
.bub.me input.ok{color:var(--ok);border-color:var(--ok)} .bub.me input.bad{color:var(--bad);border-color:var(--bad)}

/* build */
.slot{min-height:64px;border-radius:16px;border:2px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)} .slot.bad{border-color:var(--bad);background:var(--bad-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:0;background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:800;font-size:20px;box-shadow:0 0 0 2px var(--line),0 3px 0 2px var(--line);transition:transform .1s}
.tile:active{transform:translateY(2px)}
.tile.gone{visibility:hidden}
.slot .tile{background:var(--accent-soft)}
.bubble-hint{background:var(--sunk);border-radius:14px;padding:8px 14px;font-weight:700;color:var(--muted);justify-self:start}

/* choose / fix */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
.opt{border:0;border-radius:16px;padding:14px 16px;font-weight:800;font-size:20px;background:var(--surface);box-shadow:0 0 0 2px var(--line),0 4px 0 2px var(--line);text-align:left;display:flex;gap:10px;align-items:center}
.opt kbd{font-family:var(--f-body);font-size:13px;background:var(--sunk);border-radius:6px;padding:0 7px;color:var(--muted)}
.opt.ok{background:var(--ok-soft);box-shadow:0 0 0 2px var(--ok),0 4px 0 2px var(--ok)}
.opt.bad{background:var(--bad-soft);box-shadow:0 0 0 2px var(--bad),0 4px 0 2px var(--bad)}
.opt:disabled{cursor:default}
.fixrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fixrow input{font:inherit;font-size:21px;font-weight:800;color:var(--accent);background:var(--accent-soft);border:0;border-bottom:3px solid var(--accent);border-radius:8px;padding:6px 12px;flex:1 1 220px;min-width:0}
.fixrow input.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok)} .fixrow input.bad{color:var(--bad);background:var(--bad-soft);border-color:var(--bad)}

/* match */
.board{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.col{display:grid;gap:10px;align-content:start}
.mitem{border:0;text-align:left;border-radius:14px;padding:12px 14px;font-weight:700;font-size:18px;line-height:1.4;background:var(--surface);box-shadow:0 0 0 2px var(--line),0 3px 0 2px var(--line);transition:transform .1s}
.mitem.sel{box-shadow:0 0 0 3px var(--accent),0 3px 0 3px var(--accent);transform:translateY(-1px)}
.mitem.done{opacity:.9;cursor:default}
.mitem.bad{animation:shake .35s;box-shadow:0 0 0 3px var(--bad),0 3px 0 3px var(--bad)}
.mitem .pair{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:13px;font-weight:800;color:#fff;margin-right:6px;vertical-align:1px}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .25s}
.modal{background:var(--surface);border-radius:26px;padding:28px 24px;max-width:460px;width:100%;text-align:center;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:rise .45s cubic-bezier(.2,1.4,.4,1);max-height:100%;overflow:auto}
.modal h2{font-size:30px}
.modal p{margin:0;color:var(--muted)}
.bigstars{display:flex;justify-content:center;gap:10px}
.bigstars svg{width:58px;height:58px}
.bigstars svg.on{animation:starIn .5s both}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:14px;padding:10px 6px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.medal{width:150px;height:170px;margin:0 auto;animation:swing 1.6s ease-in-out .5s both}
.modal .actions{justify-content:center}
.xpfloat{position:fixed;z-index:60;font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--gold);pointer-events:none;animation:floatUp 1s forwards;text-shadow:0 2px 0 rgba(0,0,0,.15)}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none;width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:65;background:var(--ink);color:var(--bg);font-weight:800;border-radius:999px;padding:10px 20px;animation:rise .35s;max-width:calc(100% - 32px);text-align:center}

/* today plan, course map, words, review */
.chip.due{border:0}
.chip.due.hot{background:var(--accent);color:var(--accent-ink)}
.steps{display:grid;gap:10px}
.step{display:flex;align-items:center;gap:14px;background:var(--sunk);border-radius:16px;padding:12px 14px;flex-wrap:wrap}
.step-n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--surface);flex:none}
.step.next .step-n{background:var(--accent);color:var(--accent-ink)}
.step.done .step-n{background:var(--ok);color:#fff}
.step.wait{opacity:.75}
.step-b{flex:1 1 200px;min-width:0;display:grid}
.step-b span{font-size:16px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.statgrid{grid-template-columns:1fr 1fr}}
.statgrid .stat{background:var(--surface);box-shadow:var(--shadow);text-align:center}
.sec{display:grid;gap:10px}
.sec h3{font-size:18px;color:var(--muted)}
.tiles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.utile{border:2px solid transparent;background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;display:grid;gap:4px;align-content:start;box-shadow:var(--shadow);min-width:0;transition:transform .12s}
.utile:hover{transform:translateY(-2px)}
.utile.today{border-color:var(--accent)}
.utile.done{background:color-mix(in srgb,var(--ok-soft) 60%,var(--surface))}
.utile .un{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--accent)}
.utile .ut{font-size:15px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.utile .us{display:flex;align-items:center;gap:6px;min-height:22px}
.medal-xs{width:20px;height:22px}
.wtag{font-size:12px;font-weight:800;background:var(--accent-soft);border-radius:999px;padding:1px 8px}
.mini{display:block;flex:1;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}.mini i{display:block;height:100%;background:var(--gold)}
.dots i.seen{background:var(--line)}
.from{font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.story-d summary{cursor:pointer;font-weight:800;color:var(--accent)}
.story-d p{margin:8px 0 0;font-size:17px}
.small{font-size:16px}
.rbar{height:8px}
.wcard{text-align:left}
.wword{font-family:var(--f-display);font-weight:600;font-size:38px;line-height:1.15;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wdef{margin:0;font-size:21px;font-weight:700}
.wex{margin:0;font-size:21px;line-height:1.7}
.wex mark{background:var(--gold-soft);color:var(--ink);border-radius:6px;padding:0 4px;font-weight:800}
.wru{margin:0;font-size:18px;color:var(--muted)}
.wru span,.ru-inline{font-size:13px;font-weight:800;background:var(--sunk);border-radius:6px;padding:1px 6px;color:var(--muted)}
.ru-inline{font-size:16px;font-weight:700;padding:2px 8px}
.wcard .sent input{min-width:120px}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rate .btn{padding:12px 6px;min-width:0}
.rate kbd{font-family:var(--f-body);font-size:12px;opacity:.7}
.r-again{background:var(--bad-soft)!important}.r-good{background:var(--ok-soft)!important}.r-easy{background:var(--gold-soft)!important}
.tabs{display:flex;gap:6px;background:var(--sunk);border-radius:14px;padding:5px;width:max-content;max-width:100%;flex-wrap:wrap}
.tab{border:0;background:none;border-radius:10px;padding:8px 14px;font-weight:800;font-size:16px;color:var(--muted)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
#map{display:grid;gap:22px}
.chip.ask{border:0;background:var(--accent-soft);color:var(--ink)}
.btn.sm{padding:7px 14px;font-size:16px;border-radius:11px}
.hlist{display:grid;gap:8px}
.hrow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);flex-wrap:wrap}
.hid{font-family:var(--f-display);font-weight:700;color:var(--accent);min-width:52px}
.ht{flex:1 1 140px;min-width:0;font-weight:700}
.hs{display:flex;gap:2px;align-items:center;color:var(--muted);font-weight:800;font-size:15px}
.brows{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.bn{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted);text-align:center}
.brow .bans{font:inherit;font-size:20px;font-weight:700;color:var(--ink);background:var(--sunk);border:2px solid transparent;border-radius:10px;padding:8px 12px;min-width:0;width:100%}
.brow .bans:focus{border-color:var(--accent)}
.brow.ok .bans{background:var(--ok-soft);color:var(--ok)} .brow.miss .bans{background:var(--bad-soft);color:var(--bad)} .brow.skip .bans{opacity:.6}
.bans.need{animation:shake .4s;border-color:var(--bad)!important}
.bmark{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.bchip{font-weight:800;font-size:15px;border-radius:999px;padding:4px 12px;background:var(--sunk)}
.bchip.ok{background:var(--ok-soft);color:var(--ok)} .bchip.miss{background:var(--bad-soft);color:var(--bad)}
.bextra{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap}
.bextra input{font:inherit;font-size:17px;flex:1 1 200px;min-width:0;background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--ink)}
.brow .ai-out{grid-column:2/-1}
@media (max-width:560px){.brow{grid-template-columns:28px minmax(0,1fr)}.bmark{grid-column:2;justify-content:flex-start}}
.ai{display:flex;gap:8px;flex-wrap:wrap}
.aib{border:0;border-radius:999px;padding:7px 14px;font-weight:800;font-size:15px;background:var(--accent-soft);color:var(--ink)}
.aibox{background:var(--sunk);border-radius:16px;padding:14px 16px;display:grid;gap:10px;font-size:18px;line-height:1.6}
.aibox p{margin:0}
.vizbox{background:#fff}
.vizbox svg{display:block;max-width:100%;height:auto}
.sent.sm{font-size:20px;line-height:1.8;margin:0}
.sent.sm input{font:inherit;font-weight:800;color:var(--accent);background:var(--surface);border:0;border-bottom:3px solid var(--accent);border-radius:8px 8px 2px 2px;padding:0 8px;width:9ch;min-width:90px}
.sent.sm input.ok{color:var(--ok);border-color:var(--ok)} .sent.sm input.bad{color:var(--bad);border-color:var(--bad)}
.tq{display:grid;gap:4px}
.askm{max-width:620px;text-align:left}
.chatlog{display:grid;gap:8px;max-height:46vh;overflow:auto}
.chatlog .bub{font-size:17px;line-height:1.55}
#askq{font:inherit;font-size:18px;width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);color:var(--ink);resize:vertical}
.rule{background:var(--surface);border-radius:22px;padding:20px 22px;box-shadow:var(--shadow);display:grid;gap:12px;border-left:0}
.rule-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rule ul{margin:0;padding-left:22px;display:grid;gap:8px;font-size:19px;line-height:1.55}
.rule-ex{display:grid;gap:6px;background:var(--accent-soft);border-radius:14px;padding:12px 16px}
.rule-ex p{margin:0;font-size:20px;font-weight:700}
.rule-ru summary{cursor:pointer;font-weight:800;color:var(--accent)}
.rule-ru p{margin:8px 0 0;font-size:18px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg);opacity:0}70%{transform:scale(1.25) rotate(8deg);opacity:1}100%{transform:scale(1)}}
@keyframes floatUp{to{transform:translateY(-60px);opacity:0}}
@keyframes swing{0%{transform:rotate(-14deg) translateY(-20px);opacity:0}40%{opacity:1;transform:rotate(9deg)}70%{transform:rotate(-4deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

{ let n = 0; VSYL.forEach(([sec, list]) => list.forEach(t => { n++; UNITS["V"+n] = {u:"V"+n, n, kind:"v", label:"Vocabulary "+n, short:"V"+n, title:t, tag:"12 new words", sec, ex:null, words:null}; })); }

/* ---------- loading unit files (10 units per file) ---------- */
const chunkOf = u => Math.ceil(u/10);
const loaded = {};
function normEx(e){
  const type = ({g:"gap",c:"choose",f:"fix",b:"build",m:"match"})[e.t] || e.t;
  return {id:e.id, type, mech:e.m, title:e.ti, task:e.k, bank:e.b, who:e.w, story:e.st,
    items:e.items.map(i => ({s:i.s, a:i.a, opts:i.o, pre:i.p, u:i.u, post:i.q, ok: type==="fix" && !i.a, ctx:i.c, hint:i.h, extra:i.x, pic:i.pi, before:i.bf, after:i.af, tag:i.tg, l:i.l, r:i.r}))};
}
function loadChunk(c){
  if (!loaded[c]) loaded[c] = fetch(`data/u-${String(c).padStart(2,"0")}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => { (j.units||[]).forEach(x => { if (!UNITS[x.u].ex) UNITS[x.u].ex = x.ex.map(normEx); }); Object.entries(j.words||{}).forEach(([u,ws]) => WORDS[u] = ws); })
    .catch(e => { delete loaded[c]; throw e; });
  return loaded[c];
}
const vloaded = {};
function loadVChunk(c){
  if (!vloaded[c]) vloaded[c] = fetch(`data/v-${String(c).padStart(2,"0")}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(j => (j.vunits||[]).forEach(x => { const V = UNITS["V"+x.v]; V.words = x.words; V.ex = buildVocabEx(V); }))
    .catch(e => { delete vloaded[c]; throw e; });
  return vloaded[c];
}
/* three games built from each lesson's 12 words */
function buildVocabEx(V){
  const ws = V.words, ord = shuffle(ws.map((_,i)=>i), V.u), A = ord.slice(0,6).map(i=>ws[i]), B = ord.slice(6).map(i=>ws[i]);
  const form = w => w.f || w.w;
  return [
    {id:V.u+".1", type:"match", mech:"Match up", title:"Words and meanings", task:"Tap a word, then tap its meaning.", items:A.map(w => ({l:w.w, r:w.d}))},
    {id:V.u+".2", type:"choose", mech:"Quick pick", title:"Which word fits?", task:"Pick the word or phrase that completes the sentence.",
      items:B.map((w,i) => ({s:w.e, opts:shuffle([form(w), ...shuffle(B.filter(x=>x!==w), V.u+i).slice(0,2).map(form)], V.u+"o"+i), a:form(w)}))},
    {id:V.u+".3", type:"gap", mech:"Type it", title:"Use the words", task:"Type the missing word or phrase. The box has the basic forms; change them if needed.", bank:A.map(w=>w.w),
      items:shuffle(A, V.u+"g").map(w => ({s:w.e, a:[form(w), w.w]}))}
  ];
}
async function ensureUnit(u){
  if (UNITS[u].kind === "v"){ if (!UNITS[u].ex) await loadVChunk(Math.ceil(UNITS[u].n/10)); return UNITS[u]; }
  if (!UNITS[u].ex) await loadChunk(chunkOf(u)); return UNITS[u];
}

function seeded(str){ let h=2166136261; for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619);} return ()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return ((h>>>0)%10000)/10000;}; }
function shuffle(arr,key){ const r=seeded(String(key)), a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* answer matching: case, punctuation and contractions don't matter */
function norm(s){ return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”"]/g,"").replace(/[.,!?;:()]/g," ").replace(/\s+/g," ").trim(); }
function variants(s){
  let t = norm(s).replace(/\bcan't\b/g,"cannot").replace(/\bwon't\b/g,"will not").replace(/\bshan't\b/g,"shall not")
    .replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'d\b/g," would")
    .replace(/\bcan not\b/g,"cannot");
  const out = new Set([t.replace(/'s\b/g," is"), t.replace(/'s\b/g," has"), t.replace(/ would\b/g," had").replace(/'s\b/g," is")]);
  return [...out].map(x=>x.replace(/\s+/g," ").trim());
}
function matches(input, answers){ const iv = variants(input); return [].concat(answers).some(a => variants(a).some(v => iv.includes(v))); }
function contract(a){
  return String(a).replace(/\b(i) am\b/g,"$1'm").replace(/\b(he|she|it|what|who|there|that|where) is\b/g,"$1's").replace(/\b(we|you|they) are\b/g,"$1're")
    .replace(/\bis not\b/g,"isn't").replace(/\bare not\b/g,"aren't").replace(/\bdo not\b/g,"don't").replace(/\bdoes not\b/g,"doesn't").replace(/\bdid not\b/g,"didn't")
    .replace(/\bhas not\b/g,"hasn't").replace(/\bhave not\b/g,"haven't").replace(/\bwas not\b/g,"wasn't").replace(/\bwere not\b/g,"weren't").replace(/\bhad not\b/g,"hadn't")
    .replace(/\bwill not\b/g,"won't").replace(/\bwould not\b/g,"wouldn't").replace(/\bshould not\b/g,"shouldn't").replace(/\bcould not\b/g,"couldn't").replace(/\bmust not\b/g,"mustn't").replace(/\bneed not\b/g,"needn't")
    .replace(/\bi\b/g,"I");
}
const capIf = (s, yes) => yes ? s.replace(/^./, c=>c.toUpperCase()) : s;

function upgrade(){ P = Object.assign(fresh(), P); P.rs = P.rs || {ok:0,bad:0}; P.book = P.book || {}; }
const Store = {
  ref:null,
  async init(){
    try { const raw = localStorage.getItem(LS); if (raw) P = Object.assign(P, JSON.parse(raw)); } catch {}
    upgrade();
    const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(()=>null) : Promise.resolve(null);
    const [db, user] = await Promise.all([use("db"), use("user")]);
    if (!db || !user) return false;
    try {
      const id = await user.id(); if (!id) return false;
      this.ref = db.doc(`data/users/${id}/grammar-quest`);
      const snap = await Promise.race([this.ref.get(), new Promise((_,r)=>setTimeout(()=>r(new Error("timeout")),10000))]);
      if (snap.exists) { const d = snap.data(); if ((d.updated||0) >= (P.updated||0)) { P = d; upgrade(); } }
      return true;
    } catch (e) { console.warn(e); this.ref = null; return false; }
  },
  t:null, busy:false, again:false,
  save(){
    P.updated = Date.now();
    try { localStorage.setItem(LS, JSON.stringify(P)); } catch {}
    if (!this.ref) return;
    clearTimeout(this.t); this.t = setTimeout(()=>this.flush(), 700);
  },
  async flush(){
    if (this.busy){ this.again = true; return; }
    this.busy = true;
    try { await this.ref.set(JSON.parse(JSON.stringify(P))); } catch (e) { console.warn(e); }
    this.busy = false; if (this.again){ this.again = false; this.flush(); }
  }
};

/* ---------- stats ---------- */
function exStats(ex){ let ok=0,bad=0,done=0; ex.items.forEach((_,i)=>{const r=P.items[exKey(ex,i)]; if(!r)return; if(r.r==="ok")ok++; else bad++; if(r.done)done++;}); return {ok,bad,done,total:ex.items.length,complete:done===ex.items.length}; }
function unitStats(u){ return (u.ex||[]).reduce((a,ex)=>{const s=exStats(ex);a.ok+=s.ok;a.bad+=s.bad;a.done+=s.done;a.total+=s.total;a.exDone+=s.complete?1:0;return a;},{ok:0,bad:0,done:0,total:0,exDone:0}); }
function saveProg(u){ const s = unitStats(u); P.units[u.u] = Object.assign(P.units[u.u]||{}, {prog: s.total ? s.done/s.total : 0}); }
function starsFor(ok,total){ const p = total? ok/total : 0; return p>=.9?3:p>=.7?2:1; }
function medalFor(p){ return p>=.9?"gold":p>=.75?"silver":"bronze"; }
function streak(){ const set = new Set(P.days); let n=0; const d = new Date(); if(!set.has(today())) d.setDate(d.getDate()-1);
  while (set.has(dstr(d))) { n++; d.setDate(d.getDate()-1); } return n; }
function todayUnit(){ const k = SEQ.find(k => !(P.units[k]||{}).done); return UNITS[k ?? SEQ[SEQ.length-1]]; }
function unitsDone(){ return Object.values(P.units).filter(x=>x.done).length; }
function dueWords(){ const t = today(); return Object.entries(P.words).filter(([,w]) => w.due <= t).map(([k])=>k); }
function dueRev(){ const t = today(); return Object.entries(P.rev).filter(([,r]) => r.due <= t).map(([k])=>k); }
function dueCount(){ return dueWords().length + dueRev().length; }
function wordStats(){ const all = Object.values(P.words); return {learned: all.length, strong: all.filter(w=>w.box>=4).length}; }

let soundOn = true; try { soundOn = localStorage.getItem(LS+":snd") !== "off"; } catch {}
let actx = null;
function tone(notes){
  if (!soundOn) return;
  try { actx = actx || new (window.AudioContext||window.webkitAudioContext)(); } catch { return; }
  let t = actx.currentTime;
  notes.forEach(([f,d,type="sine",v=.14])=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.02); t+=d*.75; });
}

  ok: () => tone([[660,.12,"triangle"],[990,.2,"triangle"]]),

const PAL = ["#4B4FD8","#E9A82A","#17935B","#D2453F","#8D90FF","#F4BE4F","#3FCB8A","#FF7A72"];
function confetti(x,y,n=90){ if (reduced) return; for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=4+Math.random()*8; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,g:.28,life:90+Math.random()*50,c:PAL[i%PAL.length],w:6+Math.random()*6,h:4+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.4,kind:"c"}); } loop(); }
function fireworks(ms=4200){ if (reduced) return; const end = performance.now()+ms; (function spawn(){ if (performance.now()>end) return; rockets.push({x:innerWidth*(.15+Math.random()*.7),y:innerHeight,vy:-(9+Math.random()*4),ty:innerHeight*(.15+Math.random()*.3),c:PAL[Math.floor(Math.random()*PAL.length)]}); loop(); setTimeout(spawn, 260+Math.random()*260); })(); }
function burst(x,y,c){ for(let i=0;i<60;i++){ const a=Math.PI*2*i/60, s=2+Math.random()*4.5; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.06,life:60+Math.random()*30,c,kind:"s"}); } }
function loop(){ if (raf) return; const step = () => { ctx.clearRect(0,0,innerWidth,innerHeight);
  rockets = rockets.filter(r => { r.y += r.vy; r.vy *= .985; ctx.fillStyle = r.c; ctx.beginPath(); ctx.arc(r.x,r.y,3,0,7); ctx.fill(); if (r.y <= r.ty) { burst(r.x,r.y,r.c); return false; } return true; });
  parts = parts.filter(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=.985; p.life--; ctx.globalAlpha = Math.max(0,Math.min(1,p.life/40)); ctx.fillStyle = p.c;
    if (p.kind==="c"){ p.r+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); } else { ctx.beginPath(); ctx.arc(p.x,p.y,2.4,0,7); ctx.fill(); }
    ctx.globalAlpha = 1; return p.life > 0 && p.y < innerHeight+40; });
  if (parts.length || rockets.length) raf = requestAnimationFrame(step); else { raf = 0; ctx.clearRect(0,0,innerWidth,innerHeight); } };
  raf = requestAnimationFrame(step); }

  <div class="statgrid">
    <div class="stat"><b>${gDone}/${TOTAL_G}</b><span>Grammar units</span></div>
    <div class="stat"><b>${vDone}/${TOTAL_V}</b><span>Vocab lessons</span></div>
    <div class="stat"><b>${ws.learned}</b><span>Words · ${ws.strong} mastered</span></div>
    <div class="stat"><b>${Object.keys(P.rev).length}</b><span>Mistakes to fix</span></div>
  </div>
  <div class="tabs" role="tablist"><button role="tab" class="tab${tab==="g"?" on":""}" data-tab="g" aria-selected="${tab==="g"}">Grammar · 145 units</button><button role="tab" class="tab${tab==="v"?" on":""}" data-tab="v" aria-selected="${tab==="v"}">Vocabulary · 100 lessons</button></div>
  <div id="map">${tab==="g" ? gMap() : vMap()}</div>
  <p class="note">Grammar follows the 145 units of <i>English Grammar in Use</i> (5th ed.); vocabulary follows the 100 topics of <i>English Vocabulary in Use</i> (pre-intermediate &amp; intermediate). Same topics and order. Rule cards, sentences, definitions and exercises are written for this course, so you don't need the books.</p>`;
  const b = id => document.getElementById(id);
  if (b("go-rev")) b("go-rev").onclick = startReview;
  if (b("go-unit")) b("go-unit").onclick = () => openUnit(tu.u);
  document.querySelectorAll("[data-tab]").forEach(x => x.onclick = () => { try { localStorage.setItem(LS+":tab", x.dataset.tab); } catch {} renderHome(); });
  document.querySelectorAll("[data-unit]").forEach(x => x.onclick = () => openUnit(/^V/.test(x.dataset.unit) ? x.dataset.unit : +x.dataset.unit));
  updateTop();
}

/* ---------- unit play ---------- */
async function openUnit(n){
  view = {name:"loading", u:n};
  if (!UNITS[n].ex) { loadingView(`Loading ${UNITS[n].label}…`); try { await ensureUnit(n); } catch (e) { return failView(n); } }
  const u = UNITS[n];
  if (u.kind==="g") return renderUnitHub(u);
  if (u.kind==="v" && !(P.vi||{})[n]) return startLearn(n);
  const ei = u.ex.findIndex(ex => !exStats(ex).complete);
  if (ei < 0) return renderUnitDone(u);
  openEx(n, ei);
}
function renderUnitDone(u){
  view = {name:"unit", u:u.u}; const s = unitStats(u), d = P.units[u.u] || {};
  $("#app").innerHTML = `
  <div class="crumbs"><button class="link" id="back">← All units</button></div>
  <section class="hero">${d.medal ? medalSvg(d.medal,"medal-sm") : ""}
    <div class="eyebrow">${esc(u.label)} · finished</div><h1>${esc(u.title)}</h1>
    <p>${s.ok} of ${s.total} right on the first try (${Math.round(s.ok/s.total*100)}%). Redo any exercise to improve your stars and medal.</p>
    ${(u.kind==="v" ? u.words : WORDS[u.u]) ? `<div class="actions"><button class="btn" id="lw">${u.kind==="v" ? "See the words again" : (P.wl[u.u] ? "See the bonus words" : "Bonus: learn 8 words from this unit")}</button></div>` : ""}</section>
  <div class="units">${u.ex.map((ex,i) => { const es = exStats(ex); return `<div class="ucard"><div class="n"><span>EXERCISE ${ex.id}</span><span class="stars">${starRow(starsFor(es.ok,es.total))}</span></div>
    <h3>${esc(ex.title)}</h3><div class="tag">${es.ok}/${es.total} first try · ${es.bad} mistakes</div><div><button class="btn" data-redo="${i}">Redo</button></div></div>`; }).join("")}</div>`;
  $("#back").onclick = renderHome;
  if ($("#lw")) $("#lw").onclick = () => startLearn(u.u, u.kind==="v" || !!P.wl[u.u]);
  document.querySelectorAll("[data-redo]").forEach(b => b.onclick = () => { const ex = u.ex[+b.dataset.redo]; ex.items.forEach((_,i)=>delete P.items[exKey(ex,i)]); saveProg(u); Store.save(); openEx(u.u, +b.dataset.redo); });
  updateTop(); scrollTo(0,0);
}
function openEx(n, ei){
  const ex = UNITS[n].ex[ei];
  let ii = ex.items.findIndex((_,i)=>!(P.items[exKey(ex,i)]||{}).done); if (ii < 0) ii = 0;
  view = {name:"play", u:n, ei, ii, tries:0};
  renderPlay(); scrollTo(0,0);
}
function exHead(ex, extra=""){
  return `<div class="ex-head"><div class="ex-num"><span class="badge">${ex.id}</span><span class="mech">${esc(ex.mech||"Practice")}</span>${extra}</div>
    <h2>${esc(ex.title)}</h2><p class="task">${esc(ex.task)}</p></div>
    ${ex.story ? `<div class="story"><div class="face" aria-hidden="true">${ex.story.face||"📖"}</div><div><b>${esc(ex.story.name||"")}</b><p>${esc(ex.story.text)}</p></div></div>` : ""}`;
}
function renderPlay(){
  const u = UNITS[view.u], ex = u.ex[view.ei];
  const bankUsed = new Set(ex.items.map((it,i)=>{ const r = P.items[exKey(ex,i)]; return r && r.done && ex.bank && ex.type==="gap" ? bankWord(ex,it) : null; }).filter(Boolean));
  $("#app").innerHTML = `
  <div class="crumbs"><button class="link" id="back">← ${u.kind==="g" ? "Unit "+u.u+" · the rule" : "All units"}</button><span>${esc(u.label)} · ${esc(u.title)}</span><span>· Exercise ${view.ei+1} of ${u.ex.length}</span></div>
  ${exHead(ex)}
  ${ex.bank && ex.type==="gap" ? `<div class="bank" id="bank">${ex.bank.map(w=>`<button data-w="${esc(w)}" class="${bankUsed.has(w)?"used":""}">${esc(w)}</button>`).join("")}</div>` : ""}
  ${ex.type==="match" ? "" : `<div class="dots" id="dots">${ex.items.map((_,i)=>`<i data-i="${i}"></i>`).join("")}</div>`}
  <div id="stage"></div>`;
  $("#back").onclick = () => u.kind==="g" ? renderUnitHub(u) : renderHome();
  if (ex.type==="match") renderMatch(ex); else renderItem();
  updateTop();
}
function paintDots(){
  if (view.name!=="play") return;
  const ex = UNITS[view.u].ex[view.ei];
  document.querySelectorAll("#dots i").forEach((d,i)=>{ const r = P.items[exKey(ex,i)]; d.className = (r&&r.done) ? r.r : (i===view.ii ? "cur" : ""); });
}
/* the item being answered right now, in a unit or in a review */
function cur(){
  if (view.name==="review"){ const t = view.q[view.qi]; return {ex:t.ex, it:t.it, k:t.key, rev:true}; }
  const ex = UNITS[view.u].ex[view.ei]; return {ex, it:ex.items[view.ii], k:exKey(ex,view.ii), rev:false};
}

function gapHtml(s, inputId){
  const [a,b=""] = s.split("___");
  const m = b.match(/^(\s*\([^)]*\))(.*)$/);
  const after = m ? `<span class="hint">${esc(m[1])}</span>${esc(m[2])}` : esc(b);
  return `${esc(a)}<input id="${inputId}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer">${after}`;
}
function fullSentence(s, ans){ return s.replace("___", ans).replace(/\s*\([^)]*\)/g,"").replace(/^'|'$/g,""); }

function renderItem(){
  const {ex, it, rev} = cur(); view.tries = 0; view.missed = false; view.lastPick = ""; paintDots();
  const st = $("#stage");
  let body = "";
  if (ex.type==="gap"){
    if (ex.who){
      const [them, me] = ex.who;
      body = `<div class="chat">
        ${it.before ? `<div class="bub them"><small>${esc(them)}</small>${esc(it.before)}</div>` : ""}
        <div class="bub me"><small>${esc(me)}</small>${gapHtml(it.s,"ans")}</div>
        ${it.after ? `<div class="bub them"><small>${esc(them)}</small>${esc(it.after)}</div>` : ""}
      </div>`;
    } else if (it.s === "___"){
      body = `${it.ctx?`<p class="ctx">${esc(it.ctx)}</p>`:""}<div class="fixrow"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the whole sentence…" aria-label="Your sentence"></div>`;
    } else {
      body = `${it.pic?`<div class="pic" aria-hidden="true">${it.pic}</div>`:""}${it.tag?`<p class="ctx"><b>${esc(it.tag)}</b></p>`:""}${it.ctx?`<p class="ctx">${esc(it.ctx)}</p>`:""}<p class="sent">${gapHtml(it.s,"ans")}</p>`;
    }
    if (rev && ex.bank) body = `<div class="bank" id="bank">${ex.bank.map(w=>`<button data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>` + body;
  } else if (ex.type==="choose"){
    const opts = it.opts || ex.bank;
    const usedOpts = (!rev && ex.bank) ? new Set(ex.items.map((x,i)=>(P.items[exKey(ex,i)]||{}).done ? x.a : null).filter(Boolean)) : new Set();
    body = `${it.ctx?`<p class="ctx">${esc(it.ctx)}</p>`:""}<p class="sent">${esc(it.s).replace("___",'<span class="u">_____</span>')}</p>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-o="${esc(o)}" ${usedOpts.has(o)?'style="opacity:.45"':""}><kbd>${k+1}</kbd>${esc(o)}</button>`).join("")}</div>`;
  } else if (ex.type==="fix"){
    body = `<p class="sent">${esc(it.pre)}<span class="u">${esc(it.u)}</span>${esc(it.post)}</p>
      <div class="opts" id="fixopts"><button class="opt" data-f="ok"><kbd>1</kbd>✓ Looks right</button><button class="opt" data-f="fix"><kbd>2</kbd>✎ Fix it</button></div>
      <div class="fixrow" id="fixrow" hidden><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Correct form of “${esc(it.u)}”" aria-label="Correct form"></div>`;
  } else if (ex.type==="build"){
    const words = it.a.split(" ");
    const tiles = shuffle(words.concat(it.extra||[]), ex.id+"|"+it.a);
    body = `${it.pic?`<div class="pic" aria-hidden="true">${it.pic}</div>`:""}
      ${it.ctx?`<p class="ctx">${esc(it.ctx)}</p>`:""}
      ${it.hint?`<div class="bubble-hint">(${esc(it.hint)})</div>`:""}
      <div class="slot" id="slot" aria-label="Your sentence"></div>
      <div class="tiles" id="tiles">${tiles.map((w,k)=>`<button class="tile" data-k="${k}">${esc(w)}</button>`).join("")}</div>`;
  }
  const needsCheck = ex.type==="gap" || ex.type==="build";
  st.innerHTML = `<div class="card" id="card">${rev ? `<div class="from">From ${esc(ex.id[0]==="V" ? "Vocabulary "+ex.id.slice(1).split(".")[0] : "Unit "+ex.id.split(".")[0])} · ${esc(ex.title)}</div><p class="task">${esc(ex.task)}</p>${ex.story?`<details class="story-d"><summary>Read the text again</summary><p>${esc(ex.story.text)}</p></details>`:""}` : ""}${body}
    <div class="fb" id="fb" aria-live="polite"></div>
    <div class="actions">${needsCheck?`<button class="btn primary" id="check">Check</button>`:""}<button class="btn" id="next" hidden>Next →</button><button class="link" id="reveal" hidden>Show answer</button></div>
    <div id="aislot"></div>
  </div>`;
  wireItem(ex, it);
}

function wireItem(ex, it){
  const inp = $("#ans");
  if (inp){
    const grow = () => { inp.style.width = Math.max(10, inp.value.length+2)+"ch"; }; if (!inp.closest(".fixrow")) { inp.addEventListener("input", grow); grow(); }
    if (ex.type!=="fix") setTimeout(()=>inp.focus({preventScroll:true}), 50);
    inp.addEventListener("keydown", e => { if (e.key==="Enter"){ e.preventDefault(); if (!$("#next").hidden) $("#next").click(); else if ($("#check")) $("#check").click(); } });
  }
  const bank = $("#bank");
  if (bank) bank.querySelectorAll("button").forEach(b => b.onclick = () => { if (!inp || inp.disabled) return; inp.value = (inp.value.trim()? inp.value.trim()+" " : "") + b.dataset.w; inp.dispatchEvent(new Event("input")); inp.focus(); });
  $("#next").onclick = () => advance();
  $("#reveal").onclick = () => finishItem(false, true);

  if (ex.type==="gap"){
    $("#check").onclick = () => { const v = inp.value.trim(); if (!v){ inp.focus(); return; } judge(matches(v, it.a), inp); };
  }
  if (ex.type==="choose"){
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (b.disabled) return; const ok = b.dataset.o === it.a; if (!ok) view.lastPick = b.dataset.o; b.classList.add(ok?"ok":"bad"); if (!ok) b.disabled = true; judge(ok, b); });
  }
  if (ex.type==="fix"){
    document.querySelectorAll("#fixopts .opt").forEach(b => b.onclick = () => {
      if (b.dataset.f==="ok"){ if (it.ok){ b.classList.add("ok"); judge(true,b); } else { b.classList.add("bad"); b.disabled = true; judge(false,b,"It's not right. Fix it!"); $("#fixopts [data-f=fix]").click(); } }
      else { if (it.ok){ b.classList.add("bad"); view.tries = 1; markMiss(); finishItem(false,true,"This one was already correct!"); }
             else { $("#fixrow").hidden = false; b.classList.add("ok"); document.querySelectorAll("#fixopts .opt").forEach(x=>x.disabled=true);
               if (!$("#check")){ const c = document.createElement("button"); c.className="btn primary"; c.id="check"; c.textContent="Check"; $("#card .actions").prepend(c);
                 c.onclick = () => { const i2 = $("#ans"); const v = i2.value.trim(); if (!v) return; judge(matches(v,it.a), i2); }; }
               setTimeout(()=>$("#ans")?.focus(),30); } }
    });
  }
  if (ex.type==="build"){
    const slot = $("#slot"), tiles = $("#tiles");
    tiles.querySelectorAll(".tile").forEach(t => t.onclick = () => { if (t.classList.contains("gone") || slot.dataset.lock) return;
      const c = document.createElement("button"); c.className="tile"; c.textContent = t.textContent; c.dataset.k = t.dataset.k; slot.appendChild(c); t.classList.add("gone"); slot.classList.remove("bad");
      c.onclick = () => { if (slot.dataset.lock) return; tiles.querySelector(`[data-k="${c.dataset.k}"]`).classList.remove("gone"); c.remove(); slot.classList.remove("bad"); }; });
    $("#check").onclick = () => { const v = [...slot.children].map(c=>c.textContent).join(" "); if (!v) return; judge(norm(v)===norm(it.a), slot, null, true); };
  }
}

function markMiss(){
  if (view.name==="review"){ view.missed = true; return; }
  const {k} = cur(); if (!P.items[k]) { P.items[k] = {r:"miss", done:false}; Store.save(); updateTop(); }
}
function judge(ok, el, msg, isBuild){
  const {ex} = cur(), fb = $("#fb"), card = $("#card");
  if (ok){
    if (el && el.tagName==="INPUT"){ el.classList.remove("bad"); el.classList.add("ok"); el.disabled = true; }
    if (isBuild){ el.classList.remove("bad"); el.classList.add("ok"); el.dataset.lock = 1; }
    finishItem(true); return;
  }
  view.tries++; combo = 0; markMiss(); sfx.bad();
  if (el && el.tagName==="INPUT") el.classList.add("bad");
  if (isBuild) el.classList.add("bad");
  card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  if (view.tries >= 2){ finishItem(false, true); return; }
  fb.className = "fb bad"; fb.innerHTML = esc(msg || pick(["Not quite. Try once more!","Almost! Have another go.","Hmm, check the form and try again."]));
  $("#reveal").hidden = false;
  if (el && el.tagName==="INPUT"){ el.focus(); el.select(); }
}
function answerText(ex,it){
  if (ex.type==="build" || ex.type==="choose") return it.a;
  const a0 = [].concat(it.a)[0];
  if (ex.type==="fix") return it.ok ? it.u : capIf(contract(a0), !it.pre);
  return capIf(contract(a0), /^'?___/.test(it.s));
}
/* store a copy of a missed item so it comes back in review */
function addMistake(ex, it, k){
  const meta = {id:ex.id, type:ex.type, mech:ex.mech, title:ex.title, task:ex.task, bank:ex.bank, who:ex.who, story:ex.story};
  let item = it;
  if (ex.type==="match"){ // a single pair becomes a 3-way choice
    const others = shuffle(ex.items.filter(x=>x!==it).map(x=>x.r), k).slice(0,2);
    meta.type = "choose"; meta.task = "Which sentence comes next?"; item = {s:it.l+" ___", opts:shuffle([it.r, ...others], k+"o"), a:it.r};
  }
  P.rev[k] = {ex:meta, it:JSON.parse(JSON.stringify(item)), box:1, due:addDays(1)};
}
function finishItem(ok, revealed, msg){
  const {ex, it, k, rev} = cur(), fb = $("#fb"), card = $("#card");
  let first, gain;
  if (rev){
    first = ok && view.tries === 0 && !view.missed;
    gain = first ? 6 : 0; reviewResult(first);
  } else {
    first = ok && view.tries === 0 && !(P.items[k] && P.items[k].r==="miss");
    P.items[k] = {r: first ? "ok" : "miss", done:true};
    if (!first) addMistake(ex, it, k);
    gain = first ? 10 : (ok ? 4 : 0);
    saveProg(UNITS[view.u]);
  }
  P.xp += gain; if (first) combo++; else combo = 0;
  markDay(); Store.save(); updateTop(); paintDots();
  document.querySelectorAll("#card .opt,#card .tile,#ans").forEach(x=>x.disabled = true);
  $("#reveal").hidden = true; const chk = $("#check"); if (chk) chk.hidden = true;
  const full = ex.type==="build" ? it.a : ex.type==="fix" ? it.pre + answerText(ex,it) + it.post : ex.type==="choose" ? it.s.replace("___", it.a) : (it.s==="___" ? answerText(ex,it) : fullSentence(it.s, answerText(ex,it)));
  if (ok){
    sfx.ok(); card.classList.add("win"); floatXP($("#check") || card, gain);
    fb.className = "fb ok"; fb.innerHTML = (first ? pick(["Correct!","Yes!","Spot on!","Perfect!","Great!"]) : "Got it!") + " " + sayBtn(full);
    if ([3,5,8,10,15,20,30].includes(combo)){ sfx.combo(); const c = $("#combo"); c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop"); toast(`🔥 ${combo} in a row!`); }
    if (!rev && ex.bank && ex.type==="gap"){ const w = bankWord(ex,it); const bb = w && document.querySelector(`#bank [data-w="${CSS.escape(w)}"]`); if (bb) bb.classList.add("used"); }
  } else {
    fb.className = "fb bad"; fb.innerHTML = `${esc(msg || "Here's the answer:")} <span class="ans">${esc(answerText(ex,it))}</span> ${sayBtn(full)}`;
    if (ex.type==="choose"){ document.querySelectorAll(".opt").forEach(b => { if (b.dataset.o===it.a) b.classList.add("ok"); }); }
    if (ex.type==="fix" && it.ok) { const okb = document.querySelector('#fixopts [data-f=ok]'); if (okb) okb.classList.add("ok"); }
  }
  const slot = $("#aislot"); if (slot) { const uu = rev ? null : UNITS[view.u];
    slot.innerHTML = aiBar({topic: uu ? uu.label+": "+uu.title : "Exercise "+ex.id+" · "+ex.title, sentence: full, correct: answerText(ex,it), user: ($("#ans") && $("#ans").value.trim()) || view.lastPick || ""}); }
  const nx = $("#next"); nx.hidden = false; nx.disabled = false;
  nx.textContent = rev ? (view.qi === view.q.length-1 ? "Finish review ✓" : "Next →") : (view.ii === ex.items.length-1 ? "Finish exercise ✓" : "Next →");
  setTimeout(()=>nx.focus({preventScroll:true}), 30);
  const stamp = view.stamp = Math.random();
  if (ok && first && !reduced) setTimeout(()=>{ if (view.stamp === stamp && $("#next") && !$("#next").hidden) advance(); }, 1100);
}
const IRREG = {fall:"fell",pay:"paid",ring:"rang",win:"won",build:"built",choose:"chose",forget:"forgot",lose:"lost"};
function bankWord(ex,it){ const a = " "+norm([].concat(it.a)[0]); return (ex.bank||[]).find(b => IRREG[b] ? a.includes(" "+IRREG[b]) : a.includes(" "+b.slice(0, Math.max(2,b.length-1)))); }
function advance(){
  if (document.querySelector(".ov")) return;
  view.stamp = 0;
  if (view.name==="review") return nextTask();
  if (view.name!=="play") return;
  const ex = UNITS[view.u].ex[view.ei];
  if (exStats(ex).complete){ exDone(ex); return; }
  let n = ex.items.findIndex((_,i)=>i>view.ii && !(P.items[exKey(ex,i)]||{}).done);
  if (n < 0) n = ex.items.findIndex((_,i)=>!(P.items[exKey(ex,i)]||{}).done);
  view.ii = n; renderItem();
}
document.addEventListener("keydown", e => {
  if (!["play","review","learn"].includes(view.name) || document.querySelector(".ov")) return;
  const tag = document.activeElement.tagName;
  if (/^[1-4]$/.test(e.key) && tag!=="INPUT"){ const b = document.querySelectorAll("#card .opt, #card .rate button")[+e.key-1]; if (b && !b.disabled) b.click(); }
  else if (e.key===" " && tag!=="INPUT" && $("#flip")){ e.preventDefault(); $("#flip").click(); }
  else if (e.key==="Enter" && tag!=="INPUT" && tag!=="BUTTON"){ const n = $("#next"); if (n && !n.hidden) n.click(); }
});

/* match board */
function renderMatch(ex){
  const st = $("#stage");
  const left = ex.items.map((it,i)=>({i,t:it.l})), right = shuffle(ex.items.map((it,i)=>({i,t:it.r})), ex.id);
  const colorOf = i => PAL[i % PAL.length];
  const isDone = i => (P.items[exKey(ex,i)]||{}).done;
  const cell = x => `<button class="mitem${isDone(x.i)?" done":""}" data-i="${x.i}" ${isDone(x.i)?"disabled":""}>${isDone(x.i)?`<span class="pair" style="background:${colorOf(x.i)}">${x.i+1}</span>`:""}${esc(x.t)}</button>`;
  st.innerHTML = `<div class="card" id="card"><div class="board"><div class="col" id="L">${left.map(cell).join("")}</div><div class="col" id="R">${right.map(cell).join("")}</div></div>
    <div class="fb" id="fb" aria-live="polite">Tap something on the left to start.</div></div>`;
  let sel = null;
  st.querySelectorAll("#L .mitem").forEach(b => b.onclick = () => { if (b.disabled) return; st.querySelectorAll("#L .mitem").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel = +b.dataset.i; $("#fb").className="fb"; $("#fb").textContent = "Now tap its partner on the right."; });
  st.querySelectorAll("#R .mitem").forEach(b => b.onclick = () => {
    if (b.disabled) return; if (sel===null){ $("#fb").textContent = "First tap something on the left."; return; }
    const k = exKey(ex, sel), lb = st.querySelector(`#L [data-i="${sel}"]`);
    if (+b.dataset.i === sel){
      const first = !P.items[k]; P.items[k] = {r: first?"ok":"miss", done:true}; if (!first) addMistake(ex, ex.items[sel], k);
      const gain = first?10:4; P.xp += gain; first ? combo++ : combo=0;
      saveProg(UNITS[view.u]); markDay(); Store.save(); updateTop(); sfx.ok();
      [lb,b].forEach(x=>{ x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; x.insertAdjacentHTML("afterbegin", `<span class="pair" style="background:${colorOf(sel)}">${sel+1}</span>`); });
      floatXP(b, gain); $("#fb").className="fb ok"; $("#fb").textContent = pick(["Match!","Yes, that's it!","Perfect pair!"]);
      if ([3,5,8].includes(combo)){ sfx.combo(); toast(`🔥 ${combo} in a row!`); }

}

function paintBookDots(id, n){ document.querySelectorAll("#bdots i").forEach((d,i) => { const r = P.book[bkey(id,i+1)]; d.className = r ? (r.r==="skip" ? "seen" : r.r) : ""; }); }
function wireBookRows(un, id, n){
  document.querySelectorAll(".brow").forEach(row => {

      const v = inp.value.trim();

      const first = !P.book[key];
      P.book[key] = {r, v, t: today()};
      if (r==="ok"){ P.xp += 10; combo++; sfx.ok(); floatXP(row.querySelector(".bok") || row, 10); if ([3,5,8,10,15,20].includes(combo)){ sfx.combo(); toast(`🔥 ${combo} in a row!`); } }
      else if (r==="miss"){ combo = 0; sfx.bad(); P.rev["B"+key] = {ex:{id, type:"book", title:"Book exercise "+id, task:"Redo this item in your book, then mark it again.", unit:un}, it:{n:k, v}, box:1, due:addDays(1)}; }
      saveBookProg(un); markDay(); Store.save(); updateTop();

    if (undo) undo.onclick = () => { const was = P.book[key]; delete P.book[key]; delete P.rev["B"+key]; if (was && was.r==="ok") P.xp = Math.max(0, P.xp-10); saveBookProg(un); Store.save(); updateTop(); row.outerHTML = bookRowHtml(un, id, k); wireBookRows(un, id, n); paintBookDots(id, n); };
    const keyin = row.querySelector(".bkeyin"), sent = row.querySelector(".bsent");

}
function bookExDone(un, id, n){

function renderBookReview(t){

/* ---------- Claude helpers: explain, visualise, test me more, ask ---------- */
let sampleFn = null;
function aiErr(out, e){ if (e && e.code==="not_granted"){ sampleFn = null; document.querySelectorAll(".ai,[data-ask]").forEach(x=>x.remove()); out.innerHTML = `<p class="ctx">Claude features are turned off for this page.</p>`; } else out.innerHTML = `<p class="ctx">${e && e.code==="rate_limited" ? "Claude is busy. Try again in a minute." : "Claude couldn't answer. Try again."}</p>`; }
function ctxText(c){
  return ["You are a friendly English tutor for a Russian-speaking learner at level B1–B2.",
    c.topic ? "Topic: "+c.topic : "", c.ref ? "Reference: "+c.ref+" (you cannot see the book; rely on the details given)." : "",
    c.sentence ? "Sentence: "+c.sentence : "", c.word ? "Word or phrase: "+c.word+(c.def ? " (meaning: "+c.def+")" : "") : "",
    c.correct ? "Correct answer: "+c.correct : "", c.user ? "Learner's answer: "+c.user : ""].filter(Boolean).join("\n");
}
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n{2,}/g,"</p><p>").replace(/\n/g,"<br>");
function aiBar(c){ return sampleFn ? `<div class="ai" data-ctx="${esc(JSON.stringify(c))}"><button class="aib" data-ai="explain">💡 Explain</button><button class="aib" data-ai="viz">🎨 Visualize</button><button class="aib" data-ai="test">🎯 Test me more</button></div><div class="ai-out"></div>` : ""; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ai]"); if (!b) return;
  view.stamp = 0;
  const bar = b.closest(".ai"), c = JSON.parse(bar.dataset.ctx), out = bar.nextElementSibling;
  if (b.dataset.ai==="explain") aiExplain(out, c);
  if (b.dataset.ai==="viz") aiViz(out, c);
  if (b.dataset.ai==="test") aiTest(out, c);
});
async function aiExplain(out, c, ru){
  if (!sampleFn) return;
  out.innerHTML = `<div class="aibox"><p class="ctx">Claude is thinking…</p></div>`;
  const ask = c.word ? `Explain this word or phrase simply, give 3 short natural example sentences and one common mistake to avoid.`
    : c.user && c.correct && norm(c.user) !== norm(c.correct) ? `Explain briefly why the correct answer is right and what is wrong with the learner's answer.` : `Explain briefly why the correct answer is right, with the rule in one line and one more example.`;
  const prompt = ctxText(c) + "\n\n" + ask + (ru ? " Answer in Russian." : " Answer in simple English.") + " Maximum 110 words. No headings. Use **bold** for the key form.";
  try {
    const box = out.querySelector(".aibox");
    const r = await sampleFn(prompt, {modelTier:"default", onText: ({text}) => { box.innerHTML = `<p>${md(text)}</p>`; }});
    box.innerHTML = `<p>${md(r.text)}</p><div class="actions"><button class="link" data-ru>${ru ? "In English" : "Объясни по-русски"}</button>${sayBtn(r.text.replace(/\*\*/g,""))}</div>`;
    box.querySelector("[data-ru]").onclick = () => aiExplain(out, c, !ru);
  } catch (e) { aiErr(out, e); }
}
function sanitizeSvg(src){
  const m = String(src).match(/<svg[\s\S]*<\/svg>/i); if (!m) return "";
  const doc = new DOMParser().parseFromString(m[0], "image/svg+xml"), svg = doc.documentElement;
  if (!svg || svg.nodeName.toLowerCase() !== "svg") return "";
  svg.querySelectorAll("script,foreignObject,iframe,image,use,a,animate,set").forEach(n => n.remove());
  svg.querySelectorAll("*").forEach(n => [...n.attributes].forEach(a => { if (/^on/i.test(a.name) || /href/i.test(a.name) || /javascript:/i.test(a.value)) n.removeAttribute(a.name); }));
  [...svg.attributes].forEach(a => { if (/^on/i.test(a.name)) svg.removeAttribute(a.name); });
  svg.removeAttribute("width"); svg.removeAttribute("height"); svg.setAttribute("width","100%");
  return new XMLSerializer().serializeToString(svg);
}
async function aiViz(out, c){
  if (!sampleFn) return;
  out.innerHTML = `<div class="aibox"><p class="ctx">Claude is drawing…</p></div>`;
  const prompt = ctxText(c) + `\n\nDraw ONE simple diagram that makes this ${c.word ? "word's meaning" : "grammar point"} easy to remember (for tenses, a timeline with past–now–future). Return only an SVG element, nothing else. Rules: viewBox="0 0 640 300"; white background rect; fills only from #4B4FD8 #E9A82A #17935B #D2453F #E4E5FB #FCEFD2 #FFFFFF; all text fill #1B2140, font-family Arial, font-size 15–22; at most 40 words of text; no scripts, images, links or foreignObject.`;
  try {
    const r = await sampleFn(prompt, {modelTier:"default"});
    const svg = sanitizeSvg(r.text);
    out.innerHTML = svg ? `<div class="aibox vizbox">${svg}</div>` : `<div class="aibox"><p class="ctx">The picture didn't come out. Try again.</p></div>`;
  } catch (e) { aiErr(out, e); }
}
async function aiTest(out, c){
  if (!sampleFn) return;
  out.innerHTML = `<div class="aibox"><p class="ctx">Claude is writing new questions…</p></div>`;
  const prompt = ctxText(c) + `\n\nWrite 4 NEW short practice items on exactly the same ${c.word ? "word or phrase" : "grammar point"}, B1–B2 level, different sentences from the one above. Return JSON only: {"items":[{"s":"sentence with exactly one ___ gap","hint":"short clue for the gap, e.g. (verb in brackets), or empty","a":["all acceptable answers for the gap"],"why":"one short sentence explaining the answer"}]}`;
  try {
    const j = await sampleFn.json(prompt, {modelTier:"default"});
    const items = (j && j.items || []).filter(x => x && typeof x.s==="string" && x.s.includes("___") && Array.isArray(x.a) && x.a.length).slice(0,5);
    if (!items.length) throw {code:"bad"};
    out.innerHTML = `<div class="aibox"><p class="from">Extra practice from Claude</p>${items.map((x,i)=>`<div class="tq" data-i="${i}"><p class="sent sm">${esc(x.s.split("___")[0])}<input aria-label="Answer ${i+1}" autocomplete="off" autocapitalize="off" spellcheck="false">${x.hint ? `<span class="hint"> ${esc(x.hint)}</span>` : ""}${esc(x.s.split("___").slice(1).join("___"))}</p><div class="actions"><button class="btn sm">Check</button><span class="fb"></span></div></div>`).join("")}</div>`;
    out.querySelectorAll(".tq").forEach(q => { const x = items[+q.dataset.i], inp = q.querySelector("input"), fb = q.querySelector(".fb"), btn = q.querySelector("button"); let tries = 0;
      const go = () => { const v = inp.value.trim(); if (!v) return; if (matches(v, x.a)){ inp.classList.add("ok"); inp.disabled = true; btn.remove(); fb.className = "fb ok"; fb.innerHTML = (tries ? "Got it! " : "Correct! +3 XP ") + `<span class="ctx">${esc(x.why||"")}</span>`; if (!tries){ P.xp += 3; Store.save(); updateTop(); } sfx.ok(); }
        else { tries++; sfx.bad(); inp.classList.add("bad"); if (tries >= 2){ inp.disabled = true; btn.remove(); fb.className = "fb bad"; fb.innerHTML = `Answer: <span class="ans">${esc(x.a[0])}</span> <span class="ctx">${esc(x.why||"")}</span>`; } else { fb.className = "fb bad"; fb.textContent = "Try once more"; } } };
      btn.onclick = go; inp.onkeydown = e => { if (e.key==="Enter"){ e.preventDefault(); go(); } }; });
  } catch (e) { if (e && e.code==="bad") out.innerHTML = `<div class="aibox"><p class="ctx">Claude's questions didn't come through. Try again.</p></div>`; else aiErr(out, e); }
}
/* chat with Claude about whatever is on screen */
let chat = [];
function describeView(){
  const u = view.u ? UNITS[view.u] : null;
  if (view.name==="book") return `The learner is doing exercise ${BOOK[view.u][view.bi][0]} from English Grammar in Use, Unit ${view.u} (${u.title}). You can't see the book.`;
  if (u) return `The learner is studying ${u.label}: ${u.title}${u.tag ? " ("+u.tag+")" : ""}.`;
  if (view.name==="review") return "The learner is doing a spaced review of words and past mistakes.";
  return "The learner is on the home page of an English course (grammar and vocabulary, B1–B2).";
}
function openAsk(){
  if (!sampleFn) return;
  chat = [];
  const ov = modal(`<h2>Ask Claude</h2><p class="small">${esc(describeView())}</p>
    <div class="chatlog" id="chatlog"></div>
    <textarea id="askq" rows="3" placeholder="E.g. When do I use 'since' and when 'for'?" aria-label="Your question"></textarea>
    <div class="actions"><button class="btn primary" id="asksend">Ask</button><button class="btn" id="askclose">Close</button></div>`);
  ov.querySelector(".modal").classList.add("askm");
  $("#askclose").onclick = () => ov.remove();
  const send = async () => { const q = $("#askq").value.trim(); if (!q) return; $("#askq").value = "";
    const log = $("#chatlog"); log.insertAdjacentHTML("beforeend", `<div class="bub me">${esc(q)}</div><div class="bub them">…</div>`); const a = log.lastElementChild; log.scrollTop = log.scrollHeight;
    chat.push({role:"user", content: (chat.length ? "" : "Context: "+describeView()+"\nYou are a friendly English tutor for a Russian-speaking B1–B2 learner. Keep answers short and clear; answer in the language of the question.\n\n") + q});
    try { const r = await sampleFn(chat, {cache:false, onText: ({text}) => { a.innerHTML = md(text); log.scrollTop = log.scrollHeight; }}); a.innerHTML = md(r.text); chat.push({role:"assistant", content:r.text}); }
    catch (e) { a.textContent = e && e.code==="rate_limited" ? "Claude is busy. Try again in a minute." : "Claude couldn't answer. Try again."; chat.pop(); } };
  $("#asksend").onclick = send; $("#askq").onkeydown = e => { if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); send(); } };
  setTimeout(()=>$("#askq").focus(), 50);
}
document.addEventListener("click", e => { if (e.target.closest("[data-ask]")) openAsk(); });

/* ---------- boot ---------- */
$("#home-btn").onclick = () => { document.querySelectorAll(".ov").forEach(o=>o.remove()); renderHome(); };
$("#due-btn").onclick = () => { document.querySelectorAll(".ov").forEach(o=>o.remove()); startReview(); };
setSnd();
upgrade();
try { const raw = localStorage.getItem(LS); if (raw) { P = Object.assign(P, JSON.parse(raw)); upgrade(); } } catch {}
renderHome();
Store.init().then(ok => { if (ok && view.name==="home") renderHome(); else updateTop(); });
(window.claude && typeof window.claude.use === "function" ? window.claude.use("tts").catch(()=>null) : Promise.resolve(null)).then(t => { tts = t || (typeof webTts === "function" ? webTts() : null) || tts; });
(window.claude && typeof window.claude.use === "function" ? window.claude.use("sample").catch(()=>null) : Promise.resolve(null)).then(s => { sampleFn = s; $("#ask-btn").hidden = !s; if (s && view.name==="hub") renderUnitHub(UNITS[view.u]); });

</script>
<script>
/* ---------- app extras: offline cache, spoken examples, backups ---------- */
function webTts(){
  if (!("speechSynthesis" in window)) return null;
  return { speak: (text) => new Promise((res, rej) => {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    const v = speechSynthesis.getVoices().find(v => /^en[-_]GB/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
    if (v) u.voice = v; u.lang = v ? v.lang : "en-GB"; u.rate = .95;
    u.onend = () => res(); u.onerror = e => rej({code: e.error});
    speechSynthesis.speak(u);
  }) };
}
/* the boot code may ask for webTts() before this script exists, so switch it on here as well */
if (!tts) tts = webTts();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (view.name === "home") renderHome(); });
addEventListener("appinstalled", () => { installEvt = null; toast("Installed! Open Grammar Quest from your apps."); if (view.name === "home") renderHome(); });
function installBar(){

  return `<div class="install"><b>📲 Install Grammar Quest</b><p>Open this page in <b>Google Chrome</b>, then tap <b>⋮</b> (top right) → <b>Install app</b> or <b>Add to Home screen</b>. Other browsers (Samsung Internet, Yandex) have it under their menu as <b>Add page to → Home screen</b>.</p></div>`;
}
const _renderHome = renderHome;
renderHome = function(){
  _renderHome();
  $("#app").insertAdjacentHTML("afterbegin", installBar());
  const ib = $("#inst-btn"); if (ib) ib.onclick = async () => { if (!installEvt) return; installEvt.prompt(); const c = await installEvt.userChoice.catch(() => null); installEvt = null; renderHome(); };

  $("#bk-save").onclick = () => {
    const blob = new Blob([JSON.stringify(P)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "grammar-quest-backup-" + today() + ".json";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast("Backup saved to Downloads");
  };
  $("#bk-file").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;

  };

if (view.name === "home") renderHome();
